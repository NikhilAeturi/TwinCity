<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%2300d2ff'/><circle cx='50' cy='50' r='25' fill='%230a0e17'/><circle cx='50' cy='50' r='10' fill='%233b82f6'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TwinCity | Movie Directing & Cinematic Shot Simulator</title>
    <meta name="description" content="TwinCity empowers directing teams to simulate movie scenes, choreograph stunts, and capture cinematic camera shots in photorealistic 3D city environments." />
    <meta name="theme-color" content="#0a0e17" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Force <gmp-map-3d> to attach shadow root with mode: "open" so its WebGL canvas can be accessed and recorded
      const origAttachShadow = Element.prototype.attachShadow;
      Element.prototype.attachShadow = function(options, ...args) {
        if (this.nodeName === 'GMP-MAP-3D' || (options && options.mode === 'closed')) {
          return origAttachShadow.call(this, { ...options, mode: 'open' }, ...args);
        }
        return origAttachShadow.call(this, options, ...args);
      };

      // Ensure WebGL drawing buffer is preserved for captureStream() video recording without black frames
      const origGetContext = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function(type, attributes, ...args) {
        if (type === 'webgl' || type === 'webgl2') {
          attributes = Object.assign({}, attributes, {
            preserveDrawingBuffer: true
          });
        }
        return origGetContext.call(this, type, attributes, ...args);
      };
    </script>
    <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCouzkK-A4deqKt40UHZI5I9w3a3nUQsKo&v=beta&libraries=maps3d"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
